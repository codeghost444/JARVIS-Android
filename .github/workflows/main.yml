
name: Build JARVIS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verificar arquivos do projeto
        run: |
          echo "Arquivos na raiz:"
          ls -la
          echo "Arquivos Gradle:"
          find . -maxdepth 4 \( -name "*.gradle" -o -name "gradlew" -o -name "settings.gradle" \) -print

      - name: Compilar APK
        run: gradle --no-daemon clean assembleDebug

      - name: Localizar APK gerado
        if: success()
        run: |
          echo "Procurando APKs..."
          find . -type f -name "*.apk" -print
          test -n "$(find . -type f -name '*.apk' -print -quit)" || {
            echo "ERRO: Nenhum APK foi gerado."
            exit 1
          }

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: JARVIS-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
